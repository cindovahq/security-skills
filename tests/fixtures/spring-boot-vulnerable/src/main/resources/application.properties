spring.application.name=acme-portal
server.port=8080

spring.datasource.url=jdbc:postgresql://db.internal.acme.example:5432/portal
spring.datasource.username=portal_app
spring.datasource.password=acme-portal-db-password-0123456789
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.rest.base-path=/data

portal.jwt.secret=acme-portal-jwt-signing-secret-0123456789abcdef
portal.jwt.issuer=acme-portal
portal.partner.signing-key=${PARTNER_SIGNING_KEY}
portal.uploads.dir=/var/lib/acme-portal/attachments
portal.rates.base-url=https://rates.example.com

portal.discounts.rules[0]=quantity >= 100 ? 0.10 : 0.0
portal.discounts.rules[1]=unitPrice > 500 ? 0.05 : 0.0

management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.health.show-details=always

server.error.include-stacktrace=always
server.error.include-message=always

server.servlet.session.cookie.secure=true
