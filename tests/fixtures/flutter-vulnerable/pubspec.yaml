name: acme_orders
description: Order tracking, receipts and refunds for Acme Orders customers and support staff.
publish_to: 'none'
version: 1.4.2+142

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  app_links: ^7.0.0
  cloud_firestore: ^6.0.0
  crypto: ^3.0.6
  dio: ^5.9.0
  encrypt: ^5.0.3
  firebase_app_check: ^0.4.0
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  flutter_appauth: ^12.0.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^10.0.0
  go_router: ^17.0.0
  local_auth: ^3.0.0
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  sqflite: ^2.4.0
  supabase_flutter: ^2.10.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
